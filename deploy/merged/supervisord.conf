[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; One process per service, restarted on exit, logs to the container's own stdout
; so `docker logs` shows all five interleaved as they were before the merge.
;
; Everything that was a compose service name is 127.0.0.1 here, and every port is the
; one the service actually listens on inside this image — not the host port compose
; published. Host ports are the run command's business (see README).

[program:christ]
directory=/jesus/christ
command=/usr/local/bin/node server.js
environment=PORT="8001",NODE_ENV="production",ESTATE_DIR="/estate",CANTUS_URL="http://127.0.0.1:8088"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:console]
directory=/srv/console
; The console and telno both default to 8080; only the environment separates them.
; Its three links point at siblings in this container, not at compose service names.
command=/usr/local/bin/node server.js
environment=PORT="8002",NODE_ENV="production",CANTUS_URL="http://127.0.0.1:8088",TELNO_URL="http://127.0.0.1:8090",GATEWAY_URL="http://127.0.0.1:7454"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:telno]
directory=/app
; The fax T.38 listener is 5060 inside the telno container and published as 5062;
; kept at 5062 here so the border keeps 5060 and the published numbers do not move.
command=/usr/local/bin/telno-entrypoint /usr/local/bin/node src/index.js
environment=PORT="8090",NODE_ENV="production",DATA_DIR="/data/telno",ESTATE_DIR="/estate",FAX_SIP_BIND_PORT="5062"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:switch]
directory=/srv/switch
command=/usr/local/bin/node src/cli.js run
environment=NODE_ENV="production",CANTUS_CONFIG_DIR="/etc/cantus",DATA_DIR="/data/switch",CANTUS_HTTP_PORT="8088",CANTUS_BIND="0.0.0.0:7443",CANTUS_RELAY_BIND="0.0.0.0:7444",CANTUS_ROUTES_FILE="/etc/cantus/routes.json",CANTUS_LINES_FILE="/etc/cantus/lines.json",CANTUS_RECORD_DIR="/data/recordings",CANTUS_PROMPTS="/data/prompts"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
directory=/srv/gateway
; compose renamed VOIPMS_* to SIP_* and pinned SIP_LOCAL_PORT; the entrypoint does both.
command=/usr/local/bin/gateway-entrypoint
environment=NODE_ENV="production",DATA_DIR="/data/gateway"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
