[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; One process per service, restarted on exit, logs to the container's own stdout
; so `docker logs` shows all five interleaved as they were before the merge.

[program:christ]
directory=/jesus/christ
command=/usr/local/bin/node server.js
environment=PORT="8001",NODE_ENV="production",ESTATE_DIR="/estate"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:console]
directory=/srv/console
; The console and telno both default to 8080; only the environment separates them.
command=/usr/local/bin/node server.js
environment=PORT="8002",NODE_ENV="production"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:telno]
directory=/app
command=/usr/local/bin/telno-entrypoint /usr/local/bin/node src/index.js
environment=PORT="8090",NODE_ENV="production",DATA_DIR="/data/telno",ESTATE_DIR="/estate"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:switch]
directory=/srv/switch
command=/usr/local/bin/node src/cli.js run
environment=NODE_ENV="production",CANTUS_CONFIG_DIR="/etc/cantus",DATA_DIR="/data/switch",CANTUS_HTTP_PORT="8088"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
directory=/srv/gateway
command=/usr/local/bin/node src/index.js
environment=NODE_ENV="production",DATA_DIR="/data/gateway"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
